<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Who’s the Gekon? – Mobilna wersja</title>
  <link rel="stylesheet" href="/static/mobi.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
<div class="app-ver">1.0.2</div>
  <div id="hostInfo" class="host-info"> Host: —</div>
  <div class="container">
      <h1>Who’s the Gekon?</h1>
    

    <div id="status">Oczekiwanie...</div>
    <div id="role"></div>
    <div id="timer"></div>

    <div class="btn-grid">
      <button id="joinBtn" class="game-btn orange">Dołącz do gry</button>
      <button id="startBtn" class="game-btn blue">Start gry</button>
      <button id="restartBtn" class="game-btn red">Restart/Koniec</button>
      <button id="nextBtn" class="game-btn green">Następna runda</button>
    </div>

    <div class="big-btn">
      <button id="stopBtn" class="stop-button">DUŻY PRZYCISK</button>
    </div>
    

<!-- Host Controls (only visible to host) -->
<div id="hostControls" class="host-controls">
  <button id="settingsBtn" class="settings-btn">⚙️ Ustawienia</button>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Ustawienia (Host)</h2>
      <button id="closeModal" class="close-btn">✕</button>
    </div>
    
    <div class="settings-section">
      <label class="settings-label">Czas rundy (sekundy)</label>
      <div class="timer-controls">
        <input type="range" id="timerSlider" min="5" max="300" step="5" value="30" class="timer-slider">
        <div class="timer-display">
          <input type="number" id="timerSec" min="5" max="900" step="5" value="30" class="timer-input">
          <span class="timer-unit">s</span>
        </div>
      </div>
      <button id="applyTimer" class="apply-btn">Zapisz czas</button>
    </div>

    <div class="settings-section">
      <label class="settings-label">Kategorie</label>
      <div class="cat-controls">
        <button id="selectAllCats" class="select-btn">Zaznacz wszystkie</button>
        <button id="deselectAllCats" class="select-btn">Odznacz wszystkie</button>
      </div>
      <div id="catList" class="cat-list">
        {% for c in categories %}
        <label class="cat-item">
          <input type="checkbox" name="catOpt" value="{{ c }}" checked>
          <span class="cat-name">{{ c }}</span>
        </label>
        {% endfor %}
      </div>
      <button id="applyCats" class="apply-btn">Zapisz kategorie</button>
    </div>
  </div>
  <div class="modal-overlay"></div>
</div>



</body>


  <script>
    // Constants
    const VIBRATION_DURATION = 450; // 900/2 milliseconds
    const BOOM_FX_DURATION = 3000;
    const END_FX_DURATION = 1500;

    // State
    let myId = "";
    let socket = null;

    // DOM helpers
    const $ = id => document.getElementById(id);
    
    // Initialize socket connection
    socket = io();
    
    // Socket connection error handling
    socket.on("connect_error", (error) => {
      console.error("Connection error:", error);
      const statusEl = $("status");
      if (statusEl) {
        statusEl.textContent = "Błąd połączenia. Próbuję ponownie...";
      }
    });

    socket.on("disconnect", () => {
      console.warn("Disconnected from server");
      const statusEl = $("status");
      if (statusEl) {
        statusEl.textContent = "Rozłączono z serwerem";
      }
    });

    socket.on("reconnect", () => {
      console.log("Reconnected to server");
      const statusEl = $("status");
      if (statusEl) {
        statusEl.textContent = "Połączono ponownie";
      }
    });

    // Category selection helpers
    function getSelectedCats() {
      const checkboxes = document.querySelectorAll('input[name="catOpt"]:checked');
      return Array.from(checkboxes).map(el => el.value);
    }

    function applyCategorySelection(list, labelText) {
      const set = new Set(list || []);
      document.querySelectorAll('input[name="catOpt"]').forEach(cb => {
        cb.checked = set.has(cb.value);
      });

      const statusEl = $("status");
      if (statusEl) {
        statusEl.textContent = `Kategoria: ${labelText || (list && list.join(", ")) || "Losowa"}`;
      }
    }

    // Modal controls
    const settingsBtn = $("settingsBtn");
    const settingsModal = $("settingsModal");
    const closeModalBtn = $("closeModal");
    const modalOverlay = settingsModal?.querySelector(".modal-overlay");

    function openModal() {
      if (settingsModal) {
        settingsModal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      }
    }

    function closeModal() {
      if (settingsModal) {
        settingsModal.classList.add("hidden");
        document.body.style.overflow = "";
      }
    }

    if (settingsBtn) {
      settingsBtn.onclick = openModal;
    }

    if (closeModalBtn) {
      closeModalBtn.onclick = closeModal;
    }

    if (modalOverlay) {
      modalOverlay.onclick = closeModal;
    }

    // Timer slider sync with input
    const timerSlider = $("timerSlider");
    const timerInput = $("timerSec");

    if (timerSlider && timerInput) {
      timerSlider.addEventListener("input", (e) => {
        timerInput.value = e.target.value;
      });

      timerInput.addEventListener("input", (e) => {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) val = 30;
        val = Math.max(5, Math.min(900, val));
        timerSlider.value = Math.min(300, val);
        timerInput.value = val;
      });
    }

    // Timer apply
    const applyTimerBtn = $("applyTimer");
    if (applyTimerBtn) {
      applyTimerBtn.onclick = () => {
        if (!timerInput) return;
        
        const v = parseInt(timerInput.value, 10);
        if (isNaN(v) || v < 5 || v > 900) {
          alert("Czas musi być między 5 a 900 sekund");
          return;
        }
        
        socket.emit("set_timer", { seconds: v }, (ack) => {
          console.log("[ACK] set_timer:", ack);
          closeModal();
        });
      };
    }

    // Category select all/none
    const selectAllBtn = $("selectAllCats");
    const deselectAllBtn = $("deselectAllCats");
    const applyCatsBtn = $("applyCats");

    if (selectAllBtn) {
      selectAllBtn.onclick = () => {
        document.querySelectorAll('input[name="catOpt"]').forEach(cb => {
          cb.checked = true;
        });
      };
    }

    if (deselectAllBtn) {
      deselectAllBtn.onclick = () => {
        document.querySelectorAll('input[name="catOpt"]').forEach(cb => {
          cb.checked = false;
        });
      };
    }

    if (applyCatsBtn) {
      applyCatsBtn.onclick = () => {
        const cats = getSelectedCats();
        socket.emit("set_category", { categories: cats }, (ack) => {
          console.log('[ACK] set_category:', ack);
          closeModal();
        });
      };
    }



    // Show/hide host controls based on host status
    function updateHostControls(isHost) {
      const hostControls = document.querySelector(".host-controls");
      if (hostControls) {
        hostControls.style.display = isHost ? "block" : "none";
      }
    }




    // UI state management
    function showBeforeStart() {
      const joinBtn = $("joinBtn");
      const startBtn = $("startBtn");
      const restartBtn = $("restartBtn");
      const nextBtn = $("nextBtn");
      const stopBtn = $("stopBtn");
      const hostControls = document.querySelector(".host-controls");

      if (joinBtn) joinBtn.style.display = "inline-block";
      if (startBtn) startBtn.style.display = "inline-block";
      if (restartBtn) restartBtn.style.display = "inline-block";
      if (nextBtn) nextBtn.style.display = "none";
      if (stopBtn) stopBtn.style.display = "none";
      if (hostControls) hostControls.style.display = "block";
    }

    function showAfterStart() {
      const joinBtn = $("joinBtn");
      const startBtn = $("startBtn");
      const restartBtn = $("restartBtn");
      const nextBtn = $("nextBtn");
      const stopBtn = $("stopBtn");
      const hostControls = document.querySelector(".host-controls");

      if (joinBtn) joinBtn.style.display = "none";
      if (startBtn) startBtn.style.display = "none";
      if (restartBtn) restartBtn.style.display = "inline-block";
      if (nextBtn) nextBtn.style.display = "inline-block";
      if (stopBtn) stopBtn.style.display = "inline-block";
      if (hostControls) hostControls.style.display = "none";
    }

    // Initial UI state
    showBeforeStart();

    // Event handlers
    const joinBtn = $("joinBtn");
    if (joinBtn) {
      joinBtn.onclick = () => {
        const name = prompt("Podaj swoje imię:");
        if (!name || name.trim() === "") {
          alert("Musisz wpisać imię!");
          return;
        }
        myId = name.trim();
        socket.emit("join", { id: myId });
      };
    }

    const startBtn = $("startBtn");
    if (startBtn) {
      startBtn.onclick = () => {
        socket.emit("set_category", { categories: getSelectedCats() });
        socket.emit("start");
      };
    }

    const nextBtn = $("nextBtn");
    if (nextBtn) {
      nextBtn.onclick = () => {
        socket.emit("next_round");
      };
    }

    const restartBtn = $("restartBtn");
    if (restartBtn) {
      restartBtn.onclick = () => {
        socket.emit("restart");
      };
    }

    const stopBtn = $("stopBtn");
    if (stopBtn) {
      stopBtn.onclick = () => {
        if (!myId) {
          alert("Najpierw dołącz do gry!");
          return;
        }
        socket.emit("pause", { id: myId });
      };
    }


function applyCategorySelection(list, labelText) {
  // odhacz / zaznacz checkboxy
  const set = new Set(list || []);
  document.querySelectorAll('input[name="catOpt"]').forEach(cb => {
    cb.checked = set.has(cb.value);
  });
  // label nad przyciskami (jeśli masz #catLive)
  if (labelText) document.getElementById("catLive").textContent = `Kategoria: ${labelText}`;
}

    // Socket event handlers
    socket.on("joined", data => {
      const statusEl = $("status");
      if (statusEl && data.msg) {
        statusEl.innerText = data.msg;
      }
    });

    socket.on("info", data => {
      const statusEl = $("status");
      if (!statusEl) return;
      
      const msg = data.msg || "";
      statusEl.innerText = msg;

      // Switch UI based on messages
      if (msg.startsWith("Gra rozpoczęta!")) {
        showAfterStart();
      } else if (msg.startsWith("Nowa runda!")) {
        showAfterStart();
      } else if (msg.toLowerCase().includes("zresetowana")) {
        showBeforeStart();
      }
    });

    socket.on("error_msg", data => {
      if (data && data.msg) {
        alert(data.msg);
      }
    });


    socket.on("role", data => {
      const roleEl = $("role");
      if (!roleEl) return;
      
      const { category, secret, runda } = data;
      if (secret) {
        roleEl.innerText = `Runda ${runda}\n✅ Gracz\nKategoria: ${category}\nHasło: ${secret}`;
      } else {
        roleEl.innerText = `Runda ${runda}\n🕵️‍♂️ SZPIEG\nKategoria: ${category}`;
      }
      showAfterStart();
    });

    socket.on("timer", data => {
      const timerEl = $("timer");
      if (!timerEl) return;
      
      const t = data.time;
      timerEl.innerText = (t === "" || t == null) ? "" : `⏳ ${t}s`;
    });

    socket.on("timer_update", d => {
      const timerInput = $("timerSec");
      if (timerInput && d.seconds) {
        timerInput.value = d.seconds;
      }
    });

    socket.on("paused", data => {
      const statusEl = $("status");
      if (statusEl && data.msg) {
        statusEl.innerText = data.msg;
      }
    });

    socket.on("clear", () => {
      const roleEl = $("role");
      const timerEl = $("timer");
      const statusEl = $("status");
      
      if (roleEl) roleEl.innerText = "";
      if (timerEl) timerEl.innerText = "";
      if (statusEl) statusEl.innerText = "Oczekiwanie...";
      
      showBeforeStart();
      closeModal();

      // Reset all category checkboxes
      document.querySelectorAll('input[name="catOpt"]').forEach(cb => {
        cb.checked = false;
      });

      console.log("[RESET] Odznaczono wszystkie kategorie po restarcie");
    });




    socket.on("boom", data => {
      if (navigator.vibrate) {
        navigator.vibrate(VIBRATION_DURATION);
      }
      document.body.classList.add("boomFX");
      setTimeout(() => {
        document.body.classList.remove("boomFX");
      }, BOOM_FX_DURATION);
    });

    socket.on("end", data => {
      if (navigator.vibrate) {
        navigator.vibrate(VIBRATION_DURATION);
      }
      document.body.classList.add("end");
      setTimeout(() => {
        document.body.classList.remove("end");
      }, END_FX_DURATION);
    });

    // Close modal on ESC key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && settingsModal && !settingsModal.classList.contains('hidden')) {
        closeModal();
      }
    });

    socket.on("info2", data => {
      const hostInfo = $("hostInfo");
      if (hostInfo) {
        const host = data.host || "—";
        hostInfo.textContent = `Host: ${host}`;
      }
      
      // Check if current user is host
      const isHost = data.host === myId || (data.host && myId && data.host.toLowerCase() === myId.toLowerCase());
      updateHostControls(isHost);
    });

    socket.on("category_update", data => {
      if (data) {
        applyCategorySelection(data.selected, data.label);
      }
    });

</script>

</html>
